<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chayan PDF Viewer</title>
  <style>
    body { background-color: #525659; margin: 0; padding: 20px; display: flex; justify-content: center; }
    #pdf-container { position: relative; box-shadow: 0 4px 8px rgba(0,0,0,0.5); }
    /* The canvas draws the visual PDF */
    #pdf-render { display: block; }
    /* The text layer container */
    #text-layer { position: absolute; left: 0; top: 0; right: 0; bottom: 0; overflow: hidden; line-height: 1; }
    /* Forces the injected text spans to align perfectly over the canvas */
    #text-layer > span { color: transparent; position: absolute; white-space: pre; cursor: text; transform-origin: 0% 0%; }
    /* The highlight color when you select text */
    #text-layer ::selection { background: rgba(0, 120, 255, 0.3); color: transparent; }
  </style>
</head>
<body>

  <div id="pdf-container">
    <canvas id="pdf-render"></canvas>
    <div id="text-layer"></div>
  </div>

  <script type="module" src="viewer.js"></script>
</body>
</html>
